name: Build AVE2Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode:"
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build AVE2Lab
        run: |
          set -o pipefail

          xcodebuild \
            -project AVE2Lab.xcodeproj \
            -scheme AVE2Lab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          set -e

          APP="build/DerivedData/Build/Products/Release-iphoneos/AVE2Lab.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: AVE2Lab.app was not generated."
            exit 1
          fi

          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/

          cd build/ipa
          zip -r ../../AVE2Lab-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AVE2Lab-unsigned-ipa
          path: AVE2Lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
